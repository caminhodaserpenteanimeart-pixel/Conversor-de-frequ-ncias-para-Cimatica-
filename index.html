<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório de Cimática 3D - Reativo à Frequência</title>
    <style>
        :root {
            --bg-deep: #020205;
            --panel-bg: rgba(15, 23, 42, 0.65);
            --border-glow: rgba(56, 189, 248, 0.25);
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at center, #0f172a 0%, var(--bg-deep) 100%);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #painel-controle {
            position: absolute;
            top: 20px;
            z-index: 20;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 92vw;
            padding: 8px 12px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #btn-iniciar, select, button.acao {
            padding: 10px 18px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(14, 165, 233, 0.05));
            color: var(--text-main);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }

        #btn-iniciar:hover, button.acao:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        select {
            display: none;
            background-color: #0b0f19 !important;
        }

        .controles-extras {
            display: none;
            position: absolute;
            top: 80px;
            z-index: 20;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            padding: 12px 18px;
            border-radius: 16px;
            border: 1px solid var(--border-glow);
            font-size: 12px;
            gap: 16px;
            align-items: center;
        }

        #painel-info {
            position: absolute;
            bottom: 25px;
            z-index: 10;
            display: none;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            padding: 10px 20px;
            border-radius: 14px;
            border: 1px solid var(--border-glow);
            text-align: center;
            font-size: 13px;
            letter-spacing: 1.5px;
            color: var(--text-muted);
        }

        #txtFreq {
            color: var(--accent);
            font-weight: 700;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div id="painel-controle">
        <button id="btn-iniciar">Ativar Ressonância Dinâmica</button>
        <select id="seletorPadrao">
            <option value="ecosfera_biomecanica" selected >🫀 01. Ecosfera Biomecânica</option>
            <option value="vibracao_magnetohidrodinamica">🧲 02. Vibração Magnetohidrodinâmica</option>
            <option value="campo_gravitacional_torsao">🌌 03. Campo Gravitacional de Torsão</option>
            <option value="oscilacao_cristalina_prateada">❄️ 04. Oscilação Cristalina Prateada</option>
            <option value="harmonica_vazio_quantico">🌌 05. Harmônica do Vazio Quântico</option>
            <option value="ressonancia_plasma_estelar">⚡ 06. Ressonância de Plasma Estelar</option>
            <option value="esfera_ressonante">🌐 07. Esfera Ressonante & Globo Cimático</option>
            <option value="chladni_hexagonal">🛑 08. Placa Hexagonal de Chladni</option>
            <option value="vortices_acusticos">🌀 09. Vórtices Acústicos Espirais</option>
            <option value="rede_cristais_3d">💎 10. Rede de Cristais Sonorizados 3D</option>
            <option value="efeito_faraday">💧 11. Efeito Faraday em Gotas de Fluido</option>
            <option value="wave_pendulum">🌊 12. Cadeia de Pêndulos Acoplados</option>
            <option value="tubo_rubens">🔥 13. Tubo de Rubens Virtual 3D</option>
            <option value="cymascope_agua">💧 14. Cymascope de Água & Membrana Líquida</option>
            <option value="chladni_triangular">🔺 15. Placa Triangular de Chladni</option>
            <option value="chladni_radial">🔵 16. Placa Circular de Chladni (Radial)</option>
            <option value="ondas_gravitacionais">🌌 17. Ondas Gravitacionais & Anéis de Einstein</option>
            <option value="esferas_harmonicas">🌐 18. Esferas Harmônicas 3D</option>
            <option value="espiral_ulam">🔢 19. Espirais de Ulam & Primos Sonoros</option>
            <option value="atrator_lorenz">🌪️ 20. Atratores Caóticos (Lorenz & Clifford)</option>
            <option value="tubo_kundt">🧪 21. Tubo de Kundt (Ondas Estacionárias)</option>
            <option value="chladni_quadrada">🔲 22. Placa Quadrada 2D</option>
            <option value="ondas_agua">🌊 23. Ondas Concêntricas de Água</option>
            <option value="rosetas">✨ 24. Rosetas Dinâmicas Psicodélicas</option>
            <option value="hexagrama">🔯 25. Hexagrama / Estrela de 6 Pontas</option>
            <option value="matricial">🔲 26. Malha Matricial Cimática</option>
            <option value="espiral">🌀 27. Espiral Fractal</option>
            <option value="lissajous">♾️ 28. Figuras de Lissajous</option>
            <option value="redes_hexagonais">🛑 29. Redes Hexagonais de Rosetas</option>
            <option value="curvas_rosa">🌹 30. Curvas de Rosa de Grandi</option>
            <option value="espiral_aurea">🐚 31. Espiral Áurea / Logarítmica</option>
            <option value="moire">👁️ 32. Padrões de Moiré Acústico</option>
            <option value="lissajous_3d">🧊 33. Projeção Isométrica 3D (Lissajous)</option>
            <option value="julia">🔮 34. Fractais (Conjunto de Julia)</option>
            <option value="bessel">🌊 35. Modos Nodais de Bessel</option>
            <option value="cymatic_bloom">🌸 36. Flor de Lótus Cimática</option>
            <option value="quantum_vortex">⚛️ 37. Vortex Quântico de Partículas</option>
            <option value="dna_helix">🧬 38. Dupla Hélice de DNA Sonora</option>
            <option value="cymatic_plasma">⚡ 39. Plasma Eletromagnético Sonoro</option>
            <option value="mandala_sacred">🕉️ 40. Mandala de Metatron</option>
            <option value="stellar_pulsar">💫 41. Pulsação Estelar e Campo Magnético</option>
            <option value="crystal_lattice">💎 42. Rede Cristalina Piezoelétrica</option>
            <option value="harmonic_web">🕸️ 43. Teia Harmônica de Nodos Modais</option>
            <option value="bioluminescence">🌿 44. Bioluminescência Celular Reativa</option>
            <option value="superstring_brane">🎻 45. Brana de Supercordas Multidimensionais</option>
            <option value="ressonancia_37">🍩 46. Nós Toroidais (Torus Dinâmico 3D)</option>
            <option value="ressonancia_38">🔥 47. Estrelas e Polígonos de Rubens Sonoros</option>
            <option value="ressonancia_39">✨ 48. Células de Voronoi Orgânicas</option>
        </select>
        <button id="btn-salvar" class="acao" style="display:none;">📸 Salvar Mandala</button>
    </div>

    <div id="controles-extras" class="controles-extras" style="display:none;">
        <label><input type="checkbox" id="chkCores" checked> Cores Dinâmicas por Frequência</label>
        <label>Sensibilidade: <input type="range" id="sliderSensibilidade" min="0.2" max="3.0" step="0.1" value="1.2" style="width: 90px;"></label>
    </div>

    <div id="painel-info" style="display:none;">
        FREQUÊNCIA: <span id="txtFreq">0</span> Hz
    </div>

    <canvas id="canvasVisual"></canvas>

    <script>
        const btn = document.getElementById('btn-iniciar');
        const seletor = document.getElementById('seletorPadrao');
        const btnSalvar = document.getElementById('btn-salvar');
        const painelExtras = document.getElementById('controles-extras');
        const painel = document.getElementById('painel-info');
        const txtFreq = document.getElementById('txtFreq');
        const canvas = document.getElementById('canvasVisual');
        const chkCores = document.getElementById('chkCores');
        const sliderSensibilidade = document.getElementById('sliderSensibilidade');

        let ctx2D = null;
        let audioCtx, analyser, microphone, dataArray;
        let anguloGlobal = 0;

        function redimensionar() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', redimensionar);

        let particulas = [];
        function inicializarParticulas() {
            particulas = [];
            for (let i = 0; i < 3000; i++) {
                let ang = Math.random() * Math.PI * 2;
                let rad = Math.random() * 200;
                particulas.push({ x: Math.cos(ang) * rad, y: Math.sin(ang) * rad, z: Math.random() * 100 - 50 });
            }
        }

        btn.addEventListener('click', async () => {
            btn.style.display = 'none';
            seletor.style.display = 'block';
            btnSalvar.style.display = 'block';
            painelExtras.style.display = 'flex';
            painel.style.display = 'block';

            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                microphone = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 1024;
                microphone.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                inicializarParticulas();
                desenhar();
            } catch (err) {
                alert('Erro ao acessar o microfone: ' + err);
            }
        });

        btnSalvar.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `mandala-cimática-3d-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        function estimarFrequenciaDominante() {
            let maxVal = 0, maxIndex = 0;
            for (let i = 0; i < dataArray.length; i++) {
                if (dataArray[i] > maxVal) { maxVal = dataArray[i]; maxIndex = i; }
            }
            let freq = (maxIndex * (audioCtx.sampleRate / 2)) / analyser.frequencyBinCount;
            let energiaMedia = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
            return { freq: Math.round(freq), energia: energiaMedia };
        }

        function obterCorDinamica(freq) {
            if (!chkCores.checked) return 'rgba(56, 189, 248, 0.85)';
            let hue = (freq % 700) / 700 * 360;
            return `hsla(${hue}, 90%, 65%, 0.85)`;
        }

        // --- TODAS AS FUNÇÕES MODIFICADAS PARA 3D PSICODÉLICO CLIMÁTICO POR FREQUÊNCIA ---

        function desenharEcosferaBiomecanica(freq, energia, sens, cor, c) {
            c.save();
            let tempo = Date.now() * 0.002 + (freq * 0.0001);
            for (let i = 1; i <= 6; i++) {
                c.save();
                c.rotate(tempo * (i % 2 === 0 ? 0.8 : -0.8) + (freq * 0.0005));
                c.scale(1 + Math.sin(tempo + i) * 0.2, 1 + Math.cos(tempo * i) * 0.2);
                c.strokeStyle = chkCores.checked ? `hsla(${((freq + i * 45) % 700) / 700 * 360}, 95%, 60%, 0.85)` : cor;
                c.lineWidth = 1.6;
                c.beginPath();
                let raio = i * 25 + (energia * 0.4 * sens);
                for (let a = 0; a <= 120; a++) {
                    let ang = (a / 120) * Math.PI * 2;
                    let freqMod = dataArray ? (dataArray[a % dataArray.length] || 0) * 0.2 * sens : 0;
                    let r = raio + Math.sin(ang * (8 + (freq % 5)) + tempo * 4) * (15 + freqMod);
                    let x = Math.cos(ang) * r, y = Math.sin(ang) * r;
                    a === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
                }
                c.closePath(); c.stroke();
                c.restore();
            }
            c.restore();
        }

        function desenharVibracaoMagnetohidrodinamica(freq, energia, sens, cor, c) {
            c.save();
            let tempo = Date.now() * 0.003 + (freq * 0.0002);
            c.rotate(tempo * 0.3);
            for (let i = 0; i < 50; i++) {
                let ang = (i / 50) * Math.PI * 2;
                let audioMod = (dataArray ? (dataArray[i % dataArray.length] || 0) * 0.4 * sens : 0);
                let r1 = 30 + audioMod, r2 = 130 + (energia * 0.5 * sens) + audioMod;
                c.strokeStyle = chkCores.checked ? `hsla(${((freq + i * 14) % 700) / 700 * 360}, 100%, 65%, 0.8)` : cor;
                c.lineWidth = 1.4;
                c.beginPath();
                c.moveTo(Math.cos(ang) * r1, Math.sin(ang) * r1);
                c.lineTo(Math.cos(ang + tempo * 2) * r2, Math.sin(ang + tempo * 2) * r2);
                c.stroke();
            }
            c.restore();
        }

        function desenharCampoGravitacionalTorsao(freq, energia, sens, cor, c) {
            c.save();
            let tempo = Date.now() * 0.0025 + (freq * 0.00015);
            c.rotate(tempo * 0.6);
            c.lineWidth = 1.5;
            for (let k = 0; k < 3; k++) {
                c.save();
                c.rotate(k * Math.PI / 3);
                c.strokeStyle = chkCores.checked ? `hsla(${((freq + k * 100) % 700) / 700 * 360}, 90%, 60%, 0.85)` : cor;
                c.beginPath();
                for (let t = 0; t < Math.PI * 10; t += 0.04) {
                    let r = t * 8 + (energia * 0.2 * sens) + Math.sin(t * 2 - tempo * 4) * 10;
                    let x = r * Math.cos(t + tempo), y = r * Math.sin(t + tempo);
                    t === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
                }
                c.stroke();
                c.restore();
            }
            c.restore();
        }

        function desenharOscilacaoCristalinaPrateada(freq, energia, sens, cor, c) {
            c.save();
            let tempo = Date.now() * 0.002 + (freq * 0.0001);
            c.rotate(tempo * 0.3);
            for (let i = 0; i < 8; i++) {
                c.save();
                c.rotate((i * Math.PI) / 4 + tempo);
                c.scale(1 + (energia * 0.005 * sens), 1 + (energia * 0.005 * sens));
                c.strokeStyle = chkCores.checked ? `hsla(${((freq + i * 60) % 700) / 700 * 360}, 90%, 75%, 0.85)` : cor;
                c.lineWidth = 1.4;
                c.strokeRect(-60 - energia * 0.3, -60 - energia * 0.3, 120 + energia * 0.6, 120 + energia * 0.6);
                c.restore();
            }
            c.restore();
        }

        function desenharHarmonicaVazioQuantico(freq, energia, sens, cor, c) {
            c.save();
            let tempo = Date.now() * 0.004 + (freq * 0.0002);
            for (let p of particulas) {
                let dist = Math.sqrt(p.x * p.x + p.y * p.y);
                let audioMod = (dataArray ? (dataArray[Math.floor(dist) % dataArray.length] || 0) * 0.3 * sens : 0);
                let px = p.x + Math.sin(tempo + dist * 0.15) * (15 + audioMod);
                let py = p.y + Math.cos(tempo + dist * 0.15) * (15 + audioMod);
                c.fillStyle = chkCores.checked ? `hsla(${((freq + dist * 2) % 700) / 700 * 360}, 95%, 65%, 0.85)` : cor;
                c.fillRect(px, py, 2.5 + (energia * 0.02 * sens), 2.5 + (energia * 0.02 * sens));
            }
            c.restore();
        }

        function desenharRessonanciaPlasmaEstelar(freq, energia, sens, cor, c) {
            c.save();
            let tempo = Date.now() * 0.0035 + (freq * 0.0002);
            c.rotate(tempo * 1.2);
            c.strokeStyle = chkCores.checked ? `hsla(${((freq) % 700) / 700 * 360}, 100%, 70%, 0.95)` : cor;
            c.lineWidth = 2.0;
            c.beginPath();
            for (let i = 0; i < 120; i++) {
                let ang = (i / 120) * Math.PI * 2;
                let audioMod = (dataArray ? (dataArray[i % dataArray.length] || 0) * 0.4 * sens : 0);
                let r = 80 + Math.sin(ang * 14 + tempo * 6) * (35 + (energia * 0.5 * sens) + audioMod);
                let x = Math.cos(ang) * r, y = Math.sin(ang) * r;
                i === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
            }
            c.closePath(); c.stroke();
            c.restore();
        }

        function desenharEsferaRessonante(freq, energia, sens, cor, c) {
            c.save();
            let tempo = Date.now() * 0.0025 + (freq * 0.00015);
            for (let i = 0; i < 8; i++) {
                c.save();
                c.rotate(tempo * (i % 2 === 0 ? 1 : -1) + i * 0.4);
                c.strokeStyle = chkCores.checked ? `hsla(${((freq + i * 50) % 700) / 700 * 360}, 90%, 65%, 0.8)` : cor;
                c.lineWidth = 1.5;
                c.beginPath();
                c.arc(0, 0, 70 + (i * 12) + (energia * 0.3 * sens) + Math.sin(tempo * 4 + i) * 20, 0, Math.PI * 2);
                c.stroke();
                c.restore();
            }
            c.restore();
        }

        function desenharChladniHexagonal(freq, energia, sens, cor, c) {
            c.save();
            let tempo = Date.now() * 0.002 + (freq * 0.0001);
            c.rotate(tempo * 0.4);
            for (let ring = 1; ring <= 5; ring++) {
                for (let i = 0; i < 6; i++) {
                    let ang = (i / 6) * Math.PI * 2 + (tempo * 0.5);
                    let cx = Math.cos(ang) * (ring * 30 + energia * 0.2 * sens);
                    let cy = Math.sin(ang) * (ring * 30 + energia * 0.2 * sens);
                    c.strokeStyle = chkCores.checked ? `hsla(${((freq + ring * 50) % 700) / 700 * 360}, 95%, 65%, 0.85)` : cor;
                    c.lineWidth = 1.4;
                    c.save();
                    c.translate(cx, cy);
                    c.rotate(tempo * i);
                    c.strokeRect(-18, -18, 36, 36);
                    c.restore();
                }
            }
            c.restore();
        }

        function desenharVorticesAcusticos(freq, energia, sens, cor, c) {
            c.save();
            let tempo = Date.now() * 0.003 + (freq * 0.0002);
            c.rotate(tempo * 0.6);
            for (let i = 0; i < 7; i++) {
                c.strokeStyle = chkCores.checked ? `hsla(${((freq + i * 40) % 700) / 700 * 360}, 90%, 60%, 0.85)` : cor;
                c.lineWidth = 1.5;
                c.beginPath();
                c.arc(i * 12, 0, 30 + (i * 18) + (energia * 0.35 * sens) + Math.sin(tempo * 5 + i) * 15, 0, Math.PI * 2);
                c.stroke();
            }
            c.restore();
        }

        function desenharRedeCristais3D(freq, energia, sens, cor, c) {
            c.save();
            let tempo = Date.now() * 0.0025 + (freq * 0.00015);
            c.rotate(tempo * 0.5);
            for (let i = 0; i < 10; i++) {
                let ang = (i / 10) * Math.PI * 2;
                let r = 80 + (energia * 0.3 * sens);
                let x = Math.cos(ang) * r, y = Math.sin(ang) * r;
                c.strokeStyle = chkCores.checked ? `hsla(${((freq + i * 35) % 700) / 700 * 360}, 95%, 65%, 0.85)` : cor;
                c.lineWidth = 1.4;
                c.beginPath(); c.moveTo(0, 0); c.lineTo(x, y); c.stroke();
                c.save();
                c.translate(x, y);
                c.rotate(tempo * 2 + i);
                c.strokeRect(-12, -12, 24, 24);
                c.restore();
            }
            c.restore();
        }

        function desenharEfeitoFaraday(freq, energia, sens, cor, c) {
            c.save();
            let tempo = Date.now() * 0.003 + (freq * 0.0002);
            c.rotate(tempo * 0.4);
            for (let i = 0; i < 18; i++) {
                let ang = (i / 18) * Math.PI * 2;
                let audioMod = (dataArray ? (dataArray[i % dataArray.length] || 0) * 0.4 * sens : 0);
                let r = 50 + Math.sin(tempo * 5 + i) * (25 + (energia * 0.4 * sens) + audioMod);
                c.fillStyle = chkCores.checked ? `hsla(${((freq + i * 30) % 700) / 700 * 360}, 100%, 65%, 0.9)` : cor;
                c.fillRect(Math.cos(ang) * r, Math.sin(ang) * r, 6 + (energia * 0.03 * sens), 6 + (energia * 0.03 * sens));
            }
            c.restore();
        }

        function desenharWavePendulum(freq, energia, sens, cor, c) {
            c.save();
            let tempo = Date.now() * 0.0035 + (freq * 0.0002);
            c.lineWidth = 1.8;
            for (let i = -60; i <= 60; i += 5) {
                let audioMod = (dataArray ? (dataArray[Math.abs(i) % dataArray.length] || 0) * 0.3 * sens : 0);
                let h = Math.sin(i * 0.12 + tempo * 4) * (50 + (energia * 0.5 * sens) + audioMod);
                c.strokeStyle = chkCores.checked ? `hsla(${((freq + Math.abs(i) * 5) % 700) / 700 * 360}, 90%, 60%, 0.85)` : cor;
                c.beginPath();
                c.moveTo(i * 3, 0); c.lineTo(i * 3, h);
                c.stroke();
            }
            c.restore();
        }

        function desenharTuboRubens(freq, energia, sens, cor, c) {
            c.save();
            let tempo = Date.now() * 0.003 + (freq * 0.0002);
            for (let i = -25; i <= 25; i++) {
                let x = i * 11;
                let audioMod = (dataArray ? (dataArray[Math.abs(i) % dataArray.length] || 0) * 0.4 * sens : 0);
                let h = (Math.sin(i * 0.25 - tempo * 5) * 0.5 + 0.5) * (70 + (energia * 0.6 * sens) + audioMod);
                c.fillStyle = chkCores.checked ? `hsla(${((freq + i * 15) % 700) / 700 * 360}, 95%, 65%, 0.9)` : cor;
                c.fillRect(x, 0, 7, -h);
            }
            c.restore();
        }

        function desenharCymascopeAgua(freq, energia, sens, cor, c) {
            c.save();
            let tempo = Date.now() * 0.0025 + (freq * 0.00015);
            for (let r = 25; r < 150; r += 20) {
                c.strokeStyle = chkCores.checked ? `hsla(${((freq + r * 4) % 700) / 700 * 360}, 90%, 65%, 0.85)` : cor;
                c.lineWidth = 1.5;
                c.beginPath();
                c.arc(0, 0, r + Math.sin(r * 0.12 - tempo * 4) * (10 + (energia * 0.3 * sens)), 0, Math.PI * 2);
                c.stroke();
            }
            c.restore();
        }

        function desenharChladniTriangular(freq, energia, sens, cor, c) {

                c.fillRect(Math.cos(ang) * r, Math.sin(ang) * r, 3.5 + energia * 0.02 * sens, 3.5 + energia * 0.02 * sens);
            }
            c.restore();
        }

        function desenharSuperstringBrane(freq, energia, sens, cor, c) {
            c.save();
            let tempo = Date.now() * 0.0025 + (freq * 0.00015);
            c.strokeStyle = chkCores.checked ? `hsla(${((freq) % 700) / 700 * 360}, 95%, 65%, 0.9)` : cor;
            c.lineWidth = 1.6;
            c.beginPath();
            for (let x = -90; x <= 90; x += 5) {
                let audioMod = (dataArray ? (dataArray[Math.abs(x) % dataArray.length] || 0) * 0.3 * sens : 0);
                let y = Math.sin(x * 0.06 + tempo * 4) * (45 + (energia * 0.4 * sens) + audioMod);
                x === -90 ? c.moveTo(x, y) : c.lineTo(x, y);
            }
            c.stroke();
            c.restore();
        }

        function desenharNohToroidais(freq, energia, sens, cor, c) {
            c.save();
            let tempo = Date.now() * 0.0025 + (freq * 0.00015);
            c.rotate(tempo * 0.4);
            for (let i = 1; i <= 5; i++) {
                c.strokeStyle = chkCores.checked ? `hsla(${((freq + i * 45) % 700) / 700 * 360}, 90%, 65%, 0.85)` : cor;
                c.lineWidth = 1.5;
                c.beginPath();
                c.arc(0, 0, i * 24 + (energia * 0.3 * sens) + Math.sin(tempo * 3 + i) * 10, 0, Math.PI * 2);
                c.stroke();
            }
            c.restore();
        }

        function desenharRessonancia38(freq, sens, cor, c) {
            c.save();
            let tempo = Date.now() * 0.003 + (freq * 0.0002);
            let pontas = 6, raio = 85;
            let energia = dataArray ? dataArray.reduce((a, b) => a + b, 0) / dataArray.length : 20;
            c.strokeStyle = chkCores.checked ? `hsla(${((freq) % 700) / 700 * 360}, 95%, 65%, 0.9)` : cor;
            c.lineWidth = 1.6;
            c.rotate(tempo * 0.4);
            c.beginPath();
            for (let i = 0; i <= 180; i++) {
                let ang = (i / 180) * Math.PI * 2;
                let audioMod = (dataArray ? (dataArray[i % dataArray.length] || 0) * 0.3 * sens : 0);
                let r = raio + Math.sin(pontas * ang - tempo * 3) * (25 + (energia * 0.4 * sens) + audioMod);
                let x = r * Math.cos(ang), y = r * Math.sin(ang);
                i === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
            }
            c.closePath(); c.stroke();
            c.restore();
        }

        function desenharVoronoiOrganicas(freq, energia, sens, cor, c) {
            c.save();
            let tempo = Date.now() * 0.0025 + (freq * 0.00015);
            c.rotate(tempo * 0.3);
            for (let i = 0; i < 7; i++) {
                let ang = (i / 7) * Math.PI * 2;
                let x = Math.cos(ang) * 55, y = Math.sin(ang) * 55;
                c.strokeStyle = chkCores.checked ? `hsla(${((freq + i * 50) % 700) / 700 * 360}, 90%, 65%, 0.85)` : cor;
                c.lineWidth = 1.4;
                c.beginPath(); c.arc(x, y, 38 + Math.sin(tempo * 4 + i) * (12 + energia * 0.2 * sens), 0, Math.PI * 2); c.stroke();
            }
            c.restore();
        }
